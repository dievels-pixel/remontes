<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Editor de mapas · Remontes</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; font: 12px system-ui, sans-serif; color: #222; background: #ddd; }
      body { display: flex; }
      #herramientas { width: 132px; padding: 6px; background: #eee; border-right: 1px solid #bbb; overflow-y: auto; }
      #herramientas button { display: block; width: 100%; margin: 0 0 3px; padding: 4px 6px; text-align: left; font: inherit; background: #fafafa; border: 1px solid #aaa; border-radius: 3px; cursor: pointer; }
      #herramientas button.activa { background: #263; color: #fff; border-color: #263; }
      #herramientas kbd { float: right; opacity: 0.6; }
      #herramientas h4, #panel h4 { margin: 8px 0 4px; font-size: 11px; text-transform: uppercase; color: #666; }
      #lienzo { flex: 1; display: block; min-width: 0; cursor: crosshair; }
      #panel { width: 300px; padding: 6px 8px; background: #f4f4f4; border-left: 1px solid #bbb; overflow-y: auto; }
      #panel section { border-bottom: 1px solid #ccc; padding-bottom: 6px; }
      #panel label { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin: 2px 0; }
      #panel input[type=number], #panel input[type=text], #panel select { width: 110px; font: inherit; padding: 1px 3px; }
      #panel input[type=range] { width: 110px; }
      #panel textarea { width: 100%; height: 70px; font: 11px monospace; }
      #panel button { font: inherit; padding: 3px 7px; margin: 2px 2px 2px 0; cursor: pointer; }
      .fila { display: flex; flex-wrap: wrap; gap: 2px; }
      #avisos { list-style: none; margin: 0; padding: 0; max-height: 240px; overflow-y: auto; }
      #avisos li { padding: 2px 4px; margin: 1px 0; cursor: pointer; border-left: 3px solid #e0a000; background: #fff8e0; }
      #avisos li.grave { border-color: #c22; background: #fde8e8; }
      #avisos li.bien { border-color: #2a2; background: #e8f8e8; cursor: default; }
      .dato { color: #555; }
      #estado { position: fixed; left: 140px; bottom: 4px; background: rgba(255,255,255,0.85); padding: 2px 6px; border-radius: 3px; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="herramientas"></div>
    <canvas id="lienzo"></canvas>
    <div id="panel"></div>
    <div id="estado"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
